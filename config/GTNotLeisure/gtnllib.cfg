# Configuration file

##########################################################################################################
# client
#--------------------------------------------------------------------------------------------------------#
# Client settings of the shared interface and HUD
##########################################################################################################

client {
    # Show every HUD element; arrange them with Edit HUD [default: true]
    B:enableHud=true

    # Base scale of every HUD element; each element can be scaled further in the HUD editor [range: 0.5 ~ 3.0, default: 1.0]
    S:hudScale=1.0

    # Most glowing dots, puffs and sparks shown in the world at once; when there are more, the oldest disappear first [range: 128 ~ 4096, default: 1024]
    I:maxWorldMotes=1024

    # Theme of the screens that follow the chosen theme; only registered themes can be chosen, an empty or unknown id keeps the default theme of each screen [default: ]
    S:theme=
}


