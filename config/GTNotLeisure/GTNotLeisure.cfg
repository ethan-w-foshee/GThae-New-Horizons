# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# General section
##########################################################################################################

general {

    ##########################################################################################################
    # debug
    #--------------------------------------------------------------------------------------------------------#
    # Debug section
    ##########################################################################################################

    debug {
        # Enable Debug Print Log [default: false]
        B:enableDebugMode=false
    }

    ##########################################################################################################
    # client
    #--------------------------------------------------------------------------------------------------------#
    # Client section
    ##########################################################################################################

    client {
        # Beyond this distance in blocks only the main body of Celestweave armor is drawn [range: 0 ~ 256, default: 24]
        I:celestweaveDetailDistance=24

        # Celestweave arcs are not drawn beyond this distance in blocks [range: 0 ~ 256, default: 32]
        I:celestweaveFxDistance=32

        # Celestweave armor effect level: 0 off, 1 event effects only, 2 all effects [range: 0 ~ 2, default: 2]
        I:celestweaveFxLevel=2

        # Maximum number of Celestweave arcs shown for one wearer [range: 0 ~ 64, default: 16]
        I:celestweaveMaxArcsPerPlayer=16

        # Maximum number of Celestweave arcs shown in total [range: 0 ~ 1024, default: 128]
        I:celestweaveMaxArcsTotal=128

        # Draw the Celestweave chestplate arm over your empty first person hand [default: true]
        B:enableCelestweaveFirstPersonArm=true

        # Process your own idle Celestweave arcs in first person view [default: false]
        B:enableCelestweaveFirstPersonFx=false

        # Show arcs and event effects of other players' Celestweave armor [default: true]
        B:enableCelestweaveShowOthersFx=true

        # Tint the equipment screens and the HUD editor guides with the glow color of the Celestweave chestplate you wear or are editing; when off they use the colors of the chosen theme [default: true]
        B:enableEquipmentThemeGlowColor=true

        # Throw portal opening dots from the whole portal instead of only its edge [default: false]
        B:enablePortalGunOpenWholeFace=false

        # Puffs of light at the portal gun muzzle when it fires [default: true]
        B:enablePortalGunPuffs=true

        # Pixel rings around the portal gun shot while it flies [default: true]
        B:enablePortalGunRings=true

        # Show the trail, rings, puffs and sparks of portal guns fired by other players [default: true]
        B:enablePortalGunShowOthersFx=true

        # A flash and dots splashing up where the portal gun shot lands [default: true]
        B:enablePortalGunSparks=true

        # Soft glow and charge orb effects of the electromagnetic railgun [default: true]
        B:enableRailgunBloom=true

        # GLSL shaders for the railgun beam, charge orb and charge overlay [default: true]
        B:enableRailgunShaders=true

        # Camera and weapon shake caused by charging and firing the electromagnetic railgun [default: true]
        B:enableRailgunShake=true

        # Show beams, charge orbs, arcs and impact effects of other players' railguns [default: true]
        B:enableRailgunShowOthersFx=true

        # Enable animated text effects on this client [default: true]
        B:enableTextEffects=true

        # Chance that a portal arc has a small fork, from 0 to 1 [range: 0.0 ~ 1.0, default: 0.75]
        D:portalGunArcForkChance=0.75

        # How long a portal arc stays before it jumps somewhere else, in ticks [range: 0.5 ~ 3.0, default: 1.5]
        D:portalGunArcHop=1.5

        # Width of the white core of portal arcs, in blocks [range: 0.002 ~ 0.04, default: 0.006]
        D:portalGunArcWidth=0.006

        # Arc bursts per second near the middle of an open portal [range: 0.0 ~ 10.0, default: 0.5]
        D:portalGunCenterArcRate=0.5

        # How much a closing portal swells before it shrinks away; 0 shrinks it at once. The electric door plays its opening backwards instead [range: 0.0 ~ 0.5, default: 0.2]
        D:portalGunClosePop=0.2

        # How long a closing portal takes to shrink away, in ticks; the electric door always plays its opening backwards [range: 4 ~ 14, default: 9]
        I:portalGunCloseTicks=9

        # How far the held portal gun is pushed forward in first person, in blocks [range: -0.3 ~ 0.5, default: 0.15]
        D:portalGunHeldForward=0.15

        # How far the held portal gun tips its top toward your eye in first person, in degrees [range: -30.0 ~ 45.0, default: 15.0]
        D:portalGunHeldPitch=15.0

        # How far the held portal gun turns sideways in first person, in degrees [range: -45.0 ~ 45.0, default: 15.0]
        D:portalGunHeldYaw=15.0

        # How hard opening arcs bend: long straight runs with sharp corners, 0 is a straight line [range: 0.0 ~ 1.5, default: 0.8]
        D:portalGunOpenArcBend=0.8

        # Arcs per tick while a portal opens [range: 0.0 ~ 8.0, default: 2.0]
        D:portalGunOpenArcRate=2.0

        # How far opening arcs peak out of the portal, as a share of their length, 0 keeps them flat [range: 0.0 ~ 1.5, default: 0.6]
        D:portalGunOpenArcRise=0.6

        # How long arcs crackle when a portal opens, in ticks [range: 2.0 ~ 20.0, default: 11.5]
        D:portalGunOpenArcTicks=11.5

        # Dots thrown at each spot when a portal opens [range: 1 ~ 4, default: 1]
        I:portalGunOpenCount=1

        # Spots per block of portal edge that throw dots when a portal opens [range: 2 ~ 40, default: 6]
        I:portalGunOpenDensity=6

        # Average radius of portal opening dots, in blocks [range: 0.01 ~ 0.08, default: 0.025]
        D:portalGunOpenDotSize=0.025

        # How much speed portal opening dots keep every tick [range: 0.7 ~ 0.99, default: 0.96]
        D:portalGunOpenDrag=0.96

        # Gravity on portal opening dots, in blocks per tick squared; 0 or less makes them float [range: -0.01 ~ 0.04, default: 0.021]
        D:portalGunOpenGravity=0.021

        # How long portal opening dots wait before they move, in ticks [range: 0.0 ~ 20.0, default: 0.0]
        D:portalGunOpenHover=0.0

        # How fast portal opening dots shoot out of the portal, in blocks per tick [range: 0.0 ~ 0.4, default: 0.17]
        D:portalGunOpenJet=0.17

        # How fast portal opening dots drift outward along the portal, in blocks per tick [range: 0.0 ~ 0.06, default: 0.005]
        D:portalGunOpenSpray=0.005

        # How far portal opening dots start from the edge of the portal, in blocks [range: 0.0 ~ 0.1, default: 0.05]
        D:portalGunOpenSpread=0.05

        # Dots thrown from a portal when something passes through it [range: 0 ~ 60, default: 24]
        I:portalGunPassDotCount=24

        # How much a portal squashes, stretches and rocks when something passes through it; 0 keeps it still [range: 0.0 ~ 0.3, default: 0.12]
        D:portalGunPassJelly=0.12

        # Look of portal gun portals on this client, also switchable from the portal gun wheel. PIXEL_SWIRL: pixel art green swirl; ELECTRIC_DOOR: door with an electric frame and a starry inside; FLUID_VORTEX: oval opened by a swirl of portal fluid; GOLDEN_SWIRL: pixel art golden swirl
        # Possible values: [PIXEL_SWIRL, ELECTRIC_DOOR, FLUID_VORTEX, GOLDEN_SWIRL]
        #  [default: PIXEL_SWIRL]
        S:portalGunPortalEffect=PIXEL_SWIRL

        # Arc runs per second along the inner ring of an open portal [range: 0.0 ~ 10.0, default: 3.0]
        D:portalGunRingArcRate=3.0

        # Dots splashing up where the portal gun shot lands [range: 0 ~ 80, default: 36]
        I:portalGunSparkCount=36

        # Portal gun trail dots dropped at each spot along the flight [range: 1 ~ 4, default: 1]
        I:portalGunTrailCount=1

        # Trail dots this close to where the portal gun shot lands fade out quickly, in blocks; 0 keeps them all [range: 0.0 ~ 32.0, default: 2.0]
        D:portalGunTrailCutRange=2.0

        # How long trail dots near where the shot lands take to fade out, in ticks [range: 1.0 ~ 20.0, default: 4.0]
        D:portalGunTrailCutTicks=4.0

        # Spots per block along the flight where portal gun trail dots are dropped [range: 5 ~ 60, default: 12]
        I:portalGunTrailDensity=12

        # Average radius of a portal gun trail dot, in blocks [range: 0.01 ~ 0.08, default: 0.028]
        D:portalGunTrailDotSize=0.028

        # How long portal gun trail dots float before they fall, in ticks for every block away from the gun [range: 0.0 ~ 4.0, default: 1.5]
        D:portalGunTrailFallDelay=1.5

        # How fast portal gun trail dots fall, in blocks per tick squared [range: 0.005 ~ 0.04, default: 0.02]
        D:portalGunTrailGravity=0.02

        # How fast portal gun trail dots drift sideways away from the flight line when they appear, in blocks per tick [range: 0.0 ~ 0.06, default: 0.0125]
        D:portalGunTrailSpray=0.0125

        # How far portal gun trail dots spread from the flight line when they appear, in blocks [range: 0.0 ~ 0.1, default: 0.03]
        D:portalGunTrailWidth=0.03

        # Railgun effects of other players are not drawn beyond this distance in blocks [range: 0 ~ 256, default: 256]
        I:railgunFxDistance=256
    }

    ##########################################################################################################
    # effect
    #--------------------------------------------------------------------------------------------------------#
    # Effect section
    ##########################################################################################################

    effect {
        # When the player dies and respawns, give the player Ghost Shape effect [default: true]
        B:enableGhostlyShape=true
    }

    ##########################################################################################################
    # wireless
    #--------------------------------------------------------------------------------------------------------#
    # Wireless frequency card
    ##########################################################################################################

    wireless {
        # Maximum runtime entrances per frequency. Lowering this only prevents new entrances. [range: 1 ~ 2147483647, default: 4096]
        I:maxEntrancesPerFrequency=4096
    }

    ##########################################################################################################
    # item
    #--------------------------------------------------------------------------------------------------------#
    # Item section
    ##########################################################################################################

    item {

        ##########################################################################################################
        # energymodule
        #--------------------------------------------------------------------------------------------------------#
        # Energy module shared by the railgun and Celestweave armor
        ##########################################################################################################

        energymodule {
            # EU capacity of a railgun or armor piece with a T1 energy module installed [range: 4.9E-324 ~ 1.7976931348623157E308, default: 2.5E7]
            D:capacityT1=2.5E7

            # EU capacity of a railgun or armor piece with a T2 energy module installed [range: 4.9E-324 ~ 1.7976931348623157E308, default: 1.25E8]
            D:capacityT2=1.25E8

            # EU capacity of a railgun or armor piece with a T3 energy module installed [range: 4.9E-324 ~ 1.7976931348623157E308, default: 5.0E8]
            D:capacityT3=5.0E8
        }

        ##########################################################################################################
        # railgun
        #--------------------------------------------------------------------------------------------------------#
        # Electromagnetic Railgun
        ##########################################################################################################

        railgun {
            # Extra charging speed granted by each installed acceleration module, 0.25 means +25% [range: 0.0 ~ 1.0, default: 0.25]
            D:accelerationBonus=0.25

            # EU capacity of the railgun without an energy module [range: 4.9E-324 ~ 1.7976931348623157E308, default: 250000.0]
            D:baseCapacity=250000.0

            # Base damage of an EHV1 charged shot [range: 4.9E-324 ~ 1.7976931348623157E308, default: 100.0]
            D:baseDamageEhv1=100.0

            # Base damage of an EHV2 charged shot [range: 4.9E-324 ~ 1.7976931348623157E308, default: 300.0]
            D:baseDamageEhv2=300.0

            # Base damage of an EHV3 charged shot [range: 4.9E-324 ~ 1.7976931348623157E308, default: 600.0]
            D:baseDamageEhv3=600.0

            # Armor bypass ratio of the sustained beam, from 0 to 1 [range: 4.9E-324 ~ 1.7976931348623157E308, default: 0.4]
            D:beamBypass=0.4

            # Damage of the sustained beam per settlement [range: 4.9E-324 ~ 1.7976931348623157E308, default: 20.0]
            D:beamDamage=20.0

            # Base EU consumed by the sustained beam every damage settlement (2 ticks) [range: 4.9E-324 ~ 1.7976931348623157E308, default: 100.0]
            D:beamEuPerSettle=100.0

            # EU consumed per charging tick before reaching EHV2 [range: 4.9E-324 ~ 1.7976931348623157E308, default: 250.0]
            D:chargeEuEhv1=250.0

            # EU consumed per charging tick between EHV2 and EHV3 [range: 4.9E-324 ~ 1.7976931348623157E308, default: 1000.0]
            D:chargeEuEhv2=1000.0

            # EU consumed per charging tick after reaching EHV3 [range: 4.9E-324 ~ 1.7976931348623157E308, default: 2500.0]
            D:chargeEuEhv3=2500.0

            # Armor bypass ratio of charged shots, from 0 to 1 [range: 4.9E-324 ~ 1.7976931348623157E308, default: 0.8]
            D:chargedBypass=0.8

            # Damage of the extreme high voltage beam per settlement [range: 4.9E-324 ~ 1.7976931348623157E308, default: 200.0]
            D:ehvBeamDamage=200.0

            # Base EU consumed by the extreme high voltage beam every damage settlement (2 ticks) [range: 4.9E-324 ~ 1.7976931348623157E308, default: 1000.0]
            D:ehvBeamEuPerSettle=1000.0

            # EU equivalent of one extreme high voltage lightning, used by charged shots and the EHV beam [range: 4.9E-324 ~ 1.7976931348623157E308, default: 25600.0]
            D:ehvLightningEu=25600.0

            # Allow the railgun to damage players when the PvP setting of the railgun is enabled [default: true]
            B:enablePlayerDamage=true

            # Apply electromagnetic paralysis to players hit by the railgun [default: true]
            B:enablePlayerParalysis=true

            # Allow charged shots to destroy terrain when the terrain setting of the railgun is enabled [default: false]
            B:enableTerrain=false

            # Drop items from blocks destroyed by the railgun [default: false]
            B:enableTerrainDrops=false

            # Refill the held railgun from the owner's wireless EU network once per second [default: true]
            B:enableWirelessRefill=true

            # EU equivalent of one high voltage lightning, used by the sustained beam [range: 4.9E-324 ~ 1.7976931348623157E308, default: 1600.0]
            D:hvLightningEu=1600.0

            # Base EU consumed when firing an EHV1 charged shot [range: 4.9E-324 ~ 1.7976931348623157E308, default: 2000.0]
            D:shotEuEhv1=2000.0

            # Base EU consumed when firing an EHV2 charged shot [range: 4.9E-324 ~ 1.7976931348623157E308, default: 10000.0]
            D:shotEuEhv2=10000.0

            # Base EU consumed when firing an EHV3 charged shot [range: 4.9E-324 ~ 1.7976931348623157E308, default: 50000.0]
            D:shotEuEhv3=50000.0

            # Maximum number of blocks the railgun destroys per tick across all impacts [range: 1 ~ 10000, default: 200]
            I:terrainBlocksPerTick=200

            # Mod IDs whose blocks are never destroyed by the railgun, case-insensitive [default: [gregtech], [bartworks], [tectech], [gtnhlanth], [miscutils], [appliedenergistics2], [ae2fc], [sciencenotleisure]]
            S:terrainProtectedMods <
                gregtech
                bartworks
                tectech
                gtnhlanth
                miscutils
                appliedenergistics2
                ae2fc
                sciencenotleisure
             >
        }

        ##########################################################################################################
        # portal_gun
        #--------------------------------------------------------------------------------------------------------#
        # Portal Gun
        ##########################################################################################################

        portal_gun {
            # How long a portal gun shot flies before it opens a portal in the air, in ticks [range: 1 ~ 100, default: 5]
            I:airOpenTicks=5

            # Blocks of distance paid by 1 mB of shimmer when the destination is in the same dimension [range: 1 ~ 2147483647, default: 4]
            I:blocksPerShimmer=4

            # Dimension IDs where portals can neither open nor lead to [default: []]
            I:dimensionBlacklist <
             >

            # Most shimmer a shot can cost, in mB. Shots to another dimension always cost this much [range: 0 ~ 2147483647, default: 100]
            I:maxShimmerPerShot=100

            # Gravity on a portal gun shot, in blocks per tick squared; 0 flies straight [range: 0.0 ~ 0.2, default: 0.05]
            D:orbGravity=0.05

            # Ticks after going through a pair of portals before the same pair carries that entity again; touching either portal of the pair meanwhile restarts the wait. 0 turns it off [range: 0 ~ 1200, default: 20]
            I:pairCooldownTicks=20

            # How long a pair of portals stays open, in ticks [range: 20 ~ 2147483647, default: 100]
            I:portalLifetime=100

            # Shimmer the portal gun holds, in mB; shimmer is its only fuel [range: 100 ~ 2147483647, default: 8000]
            I:shimmerCapacity=8000
        }

        ##########################################################################################################
        # player_doll
        #--------------------------------------------------------------------------------------------------------#
        # Player Doll
        ##########################################################################################################

        player_doll {
            # Enable Custom Player Skin for Player Doll [default: true]
            B:enableCustomSkin=true

            # Make Play Doll to MAX Tier Glass [default: true]
            B:enableRegisterMAXTierGlass=true
        }

        ##########################################################################################################
        # vein_miner_pickaxe
        #--------------------------------------------------------------------------------------------------------#
        # Vein Miner Pickaxe
        ##########################################################################################################

        vein_miner_pickaxe {
            # Set maximum number of chained blocks for Vein Mining Pickaxe [range: -2147483648 ~ 2147483647, default: 327670]
            I:maxAmount=327670

            # Set maximum block distance for Vein Mining Pickaxe [range: -2147483648 ~ 2147483647, default: 32]
            I:maxRange=32
        }

        ##########################################################################################################
        # stick
        #--------------------------------------------------------------------------------------------------------#
        # Stick
        ##########################################################################################################

        stick {
            # Enable stick fake item and block [default: true]
            B:enableStickItem=true
        }

        ##########################################################################################################
        # steam_rocket
        #--------------------------------------------------------------------------------------------------------#
        # Steam Rocket
        ##########################################################################################################

        steam_rocket {
            # The Page ID for the Steam Rocket Schematic [range: -2147483648 ~ 2147483647, default: 114514]
            I:idSchematicRocketSteam=114514

            # The GUI ID for the NASA Workbench when using Steam Rocket Schematic [range: -2147483648 ~ 2147483647, default: 114514]
            I:nasaWorkbenchSteamRocket=114514
        }

        ##########################################################################################################
        # celestweave
        #--------------------------------------------------------------------------------------------------------#
        # Celestweave Armor
        ##########################################################################################################

        celestweave {
            # EU capacity of each armor piece without an energy module [range: 4.9E-324 ~ 1.7976931348623157E308, default: 2500000.0]
            D:baseCapacity=2500000.0

            # Ticks between two dashes [range: 0 ~ 1200, default: 40]
            I:dashCooldown=40

            # EU paid per dash [range: 0.0 ~ 1.0E12, default: 500000.0]
            D:dashEu=500000.0

            # Dash velocity in blocks per tick [range: 0.0 ~ 10.0, default: 2.2]
            S:dashSpeed=2.2

            # EU paid when the shield prevents a death [range: 0.0 ~ 1.0E15, default: 1.0E8]
            D:deathSaveEu=1.0E8

            # Draw from the owner's wireless EU network when the armor charge cannot pay for absorbed damage [default: true]
            B:enableWirelessFallback=true

            # Refill worn armor from the owner's wireless EU network every second [default: true]
            B:enableWirelessRefill=true

            # EU paid per tick while the wearer is flying and moving with the flight module [range: 0.0 ~ 1.0E12, default: 100.0]
            D:flightEuPerTick=100.0

            # EU paid per point of mana supplied by the terrasteel module [range: 0.0 ~ 1.0E12, default: 100.0]
            D:manaEu=100.0

            # Damage absorbed per hit by the shield [range: 0.0 ~ 1.0E9, default: 1000000.0]
            S:maxAbsorbPerHit=1000000.0

            # Upper limit of EU paid for a single hit [range: 0.0 ~ 1.0E15, default: 1.0E9]
            D:maxEuPerHit=1.0E9

            # Upper limit of the flight speed multiplier [range: 1 ~ 16, default: 8]
            I:maxFlightLevel=8

            # Upper limit of the idle arc count a wearer can choose [range: 0 ~ 8, default: 8]
            I:maxIdleArcs=8

            # Most targets struck by lightning per reflected hit, including the attacker [range: 1 ~ 16, default: 4]
            I:maxReflectTargets=4

            # Upper limit of the walk assist speed and jump multipliers [range: 1 ~ 16, default: 4]
            I:maxWalkLevel=4

            # EU paid per tick by the night vision module [range: 0.0 ~ 1.0E12, default: 5.0]
            D:nightVisionEuPerTick=5.0

            # EU paid per removed negative effect by the purification module [range: 0.0 ~ 1.0E12, default: 20000.0]
            D:purificationEu=20000.0

            # Extra reach of the reach module at level 1 [range: 0.0 ~ 100.0, default: 5.0]
            S:reachLevel1=5.0

            # Extra reach of the reach module at level 2 [range: 0.0 ~ 100.0, default: 10.0]
            S:reachLevel2=10.0

            # Extra reach of the reach module at level 3 [range: 0.0 ~ 100.0, default: 20.0]
            S:reachLevel3=20.0

            # EU paid per reflected hit or projectile [range: 0.0 ~ 1.0E12, default: 50000.0]
            D:reflectEu=50000.0

            # Radius in blocks within which the reflect module strikes hostile mobs [range: 0.0 ~ 32.0, default: 8.0]
            D:reflectRadius=8.0

            # Share of the incoming damage dealt by each lightning strike of the reflect module [range: 0.0 ~ 10.0, default: 0.5]
            S:reflectRatio=0.5

            # EU paid per point of hunger refilled by the saturation module [range: 0.0 ~ 1.0E12, default: 5000.0]
            D:saturationEu=5000.0

            # EU paid per point of absorbed damage [range: 0.0 ~ 1.0E12, default: 20000.0]
            D:shieldEuPerDamage=20000.0

            # EU paid per tick by the walk assist module while moving on the ground [range: 0.0 ~ 1.0E12, default: 20.0]
            D:walkEuPerTick=20.0
        }

    }

    ##########################################################################################################
    # machine
    #--------------------------------------------------------------------------------------------------------#
    # Machine section
    ##########################################################################################################

    machine {
        # Allow interaction with machines from their main facing (similar to GTM behavior) [default: false]
        B:allowMainFacingInteraction=false

        # Default energy consumption per operation (in AE/t) [range: 4.9E-324 ~ 1.7976931348623157E308, default: 10.0]
        D:beamFormerEnergyConsume=10.0

        # Default maximum beam length (in blocks) [range: -2147483648 ~ 2147483647, default: 256]
        I:beamFormerLength=256

        # Set Machine Can Use Laser Hatch [default: false]
        B:enableLaserHatch=false

        # Enable Purification Plant Buff, add Wireless mode and max long parallels [default: false]
        B:enablePurificationPlantBuff=false

        # Enable Output Change Function [default: true]
        B:enableRecipeOutputChance=true

        # Enable Void Miner Tweak, allows you to override target dimension that Void Miner mines [default: true]
        B:enableVoidMinerTweak=true

        # Change Recipe Item Output, like QFT [range: 4.9E-324 ~ 1.7976931348623157E308, default: 2.5]
        D:recipeOutputChance=2.5

        ##########################################################################################################
        # quantum_computer
        #--------------------------------------------------------------------------------------------------------#
        # Quantum Computer
        ##########################################################################################################

        quantum_computer {
            # Seconds of calculation time a quantum crafting plan with missing items may spend on trying alternative patterns one by one, after which the best plan found so far is kept. 0 never tries them [range: 0 ~ 2147483647, default: 5]
            I:calculationFallbackSeconds=5

            # Seconds of calculation time one quantum crafting calculation may take on a dedicated server before it fails, like MaxCraftingSteps of AE2. 0 disables the limit [range: 0 ~ 2147483647, default: 30]
            I:calculationLimitSeconds=30

            # Log the step breakdown of every quantum crafting calculation [default: false]
            B:enableCalculationLog=false

            # Log stage timings and counters of every quantum crafting calculation [default: false]
            B:enableCalculationPerformanceLog=false

            # Maximum number of data entangler allowed in a Quantum Computer [range: 1 ~ 2147483647, default: 1]
            I:maxDataEntangler=1

            # Maximum number of multi threader allowed in a Quantum Computer [range: 1 ~ 2147483647, default: 1]
            I:maxMultiThreader=1

            # Maximum size allowed for a Quantum Computer multiblock structure [range: 3 ~ 2147483647, default: 7]
            I:maxMultiblockSize=7
        }

        ##########################################################################################################
        # meteor_miner
        #--------------------------------------------------------------------------------------------------------#
        # Meteor Miner
        ##########################################################################################################

        meteor_miner {
            # Set the Meteor Miner how many every cycle break a block [range: -2147483648 ~ 2147483647, default: 1]
            I:meteorMinerMaxBlockPerCycle=1

            # Set the Meteor Miner how many every cycle break row blocks [range: -2147483648 ~ 2147483647, default: 1]
            I:meteorMinerMaxRowPerCycle=1
        }

        ##########################################################################################################
        # artificial_star
        #--------------------------------------------------------------------------------------------------------#
        # Artificial Star
        ##########################################################################################################

        artificial_star {
            # Open RenderDefaultArtificialStar rendering [default: true]
            B:EnableDefaultRender=true

            # Set the power generation of EU Every Depleted Excited Naquadah FuelRod [range: -2147483648 ~ 2147483647, default: 4125000]
            I:euEveryDepletedExcitedNaquadahFuelRod=4125000

            # Set the power generation of EU Every Enhancement Core [range: -2147483648 ~ 2147483647, default: 100]
            I:euEveryEnhancementCore=100

            # Set secondsOfArtificialStarProgressCycleTime running time [range: 4.9E-324 ~ 1.7976931348623157E308, default: 6.4]
            D:secondsOfArtificialStarProgressCycleTime=6.4
        }

        ##########################################################################################################
        # eternal_gregtech_workshop
        #--------------------------------------------------------------------------------------------------------#
        # Eternal Workshop
        ##########################################################################################################

        eternal_gregtech_workshop {
            # Enable Eternal GregTech Workshop Spiral Render, like DNA [default: false]
            B:spiralRender=false
        }

        ##########################################################################################################
        # portal_to_alfheim
        #--------------------------------------------------------------------------------------------------------#
        # Portal Alfheim
        ##########################################################################################################

        portal_to_alfheim {
            # Setting this to false will reduce the Portal To Alfheim explosion to little more then a tnt blast [default: true]
            B:bigBoom=true
        }

    }

    ##########################################################################################################
    # message
    #--------------------------------------------------------------------------------------------------------#
    # Message section
    ##########################################################################################################

    message {
        # Enable showing loaded mods info to player [default: true]
        B:enableShowAddMods=true

        # Enable welcome message when player joins [default: true]
        B:enableShowJoinMessage=true
    }

    ##########################################################################################################
    # other
    #--------------------------------------------------------------------------------------------------------#
    # Other section
    ##########################################################################################################

    other {
        # Enable sending the unfinished chat message when player dies [default: true]
        B:enableDeathIncompleteMessage=true

        # Enable Saturation Heal Tweak. When hunger is 20, player regenerates health based on saturation / 6, up to 1 HP per 0.5s [default: true]
        B:enableSaturationHeal=true

        not_enough_items {
            # Enable automatic conversion of ingotHot to ingot when writing pattern [default: true]
            B:enableReplaceHotIngotInPattern=true

            # Enable a special icon for cheat mode [default: false]
            B:enableSpecialCheatIcon=false

            # Specify the type of the special cheat icon [range: -2147483648 ~ 2147483647, default: 0]
            I:specialIconType=0
        }

        ##########################################################################################################
        # applied_energistics
        #--------------------------------------------------------------------------------------------------------#
        # Applied Energistics 2
        ##########################################################################################################

        applied_energistics {
            # Enable configurable Processing Pattern Terminal capacity behavior [default: true]
            B:enableProcessingPatternCapacityMixin=true

            # Multiplier for Processing Pattern Terminal capacity. The effective layout is 16N:4N. [range: 1 ~ 64, default: 2]
            I:processingPatternCapacityMultiplier=2
        }

    }

    ##########################################################################################################
    # re_avaritia
    #--------------------------------------------------------------------------------------------------------#
    # Re Avaritia section
    ##########################################################################################################

    re_avaritia {
        # The OreDict used for unbreakable blocks in the Extreme Anvil [default: neutronUnbreak]
        S:unbreakOre=neutronUnbreak

        ##########################################################################################################
        # infinity_sword
        #--------------------------------------------------------------------------------------------------------#
        # Infinity Sword
        ##########################################################################################################

        infinity_sword {
            # Enable Infinity Sword bypass against Blood Sword and Draconic Armor [default: true]
            B:enableBypass=true

            # Enable when Infinity Sword hit Infinity Suit create Explosion [default: true]
            B:enableExplosion=true

            # Enable Player Special Render [default: true]
            B:enableSpecialRender=true
        }

        ##########################################################################################################
        # chronarch_clock
        #--------------------------------------------------------------------------------------------------------#
        # Chronarch Clock
        ##########################################################################################################

        chronarch_clock {
            # Change Chronarchs Clock Cooldown [range: -2147483648 ~ 2147483647, default: 600]
            I:chronarchsClockCooldown=600

            # Duration of the clock's effect in ticks [range: -2147483648 ~ 2147483647, default: 200]
            I:chronarchsClockDurationTicks=200

            # Effective radius in blocks [range: -2147483648 ~ 2147483647, default: 3]
            I:chronarchsClockRadius=3

            # Speed multiplier for the clock [range: -2147483648 ~ 2147483647, default: 256]
            I:chronarchsClockSpeedMultiplier=256

            # Tile entities the clock must not accelerate. The entries are the names used in GameRegistry.registerTileEntity, for example minecraft:furnace or gregtech:gt.blockmachines. An empty list accelerates everything. [default: ]
            S:chronarchsClockTileEntityBlacklist <
             >
        }

    }

    ##########################################################################################################
    # recipe
    #--------------------------------------------------------------------------------------------------------#
    # Recipe section
    ##########################################################################################################

    recipe {
        # Significantly reduce the time required for crafting recipes [default: false]
        B:enableAssemblingLineRecipesTimeChange=false

        # Buff all chamber recipes [default: true]
        B:enableChamberRecipesBuff=true

        # Enable Delete Recipe [default: true]
        B:enableDeleteRecipe=true

        # Enable generated Shimmer disassembly recipes [default: true]
        B:enableShimmerDisassemblyRecipes=true

        # Register generated Shimmer fake recipes in NEI [default: true]
        B:enableShimmerFakeRecipeInNEI=true

        # Enable when player join world, Show Big Title [default: true]
        B:enableShowDelRecipeTitle=true

        # Enable Something Cheap Recipe [default: true]
        B:enableSomethingRecipe=true
    }

    ##########################################################################################################
    # super_creeper
    #--------------------------------------------------------------------------------------------------------#
    # Super Creeper section
    ##########################################################################################################

    super_creeper {
        # Allow creeper explosions to ignore mobGriefing gamerule and always break blocks [default: false]
        B:allowCreeperExplosionBypassGamerule=false

        # Search radius for blocks [range: -2147483648 ~ 2147483647, default: 16]
        I:blockFindRadius=16

        # Interval in ticks between block targeting scans [range: -2147483648 ~ 2147483647, default: 30]
        I:blockTargetInterval=30

        # Ticks before Creeper explodes due to burning. [range: -2147483648 ~ 2147483647, default: 30]
        I:burningExplosionTimer=30

        # The higher this value, the faster the creeper moves as it gets closer to its target [range: 4.9E-324 ~ 1.7976931348623157E308, default: 3.0]
        D:creeperSpeedBonusScale=3.0

        # List of target block IDs. Format: 'modid:blockname' or 'modid:blockname:meta'. [default: [minecraft:chest], [appliedenergistics2:tile.BlockDrive], [gregtech:gt.blockmachines], [appliedenergistics2:tile.BlockController]]
        S:defaultTargetBlocks <
            minecraft:chest
            appliedenergistics2:tile.BlockDrive
            gregtech:gt.blockmachines
            appliedenergistics2:tile.BlockController
         >

        # Enable Creeper explosion when burning. [default: true]
        B:enableCreeperBurningExplosion=true

        # Enable Creeper to find and mount nearby Spiders. [default: true]
        B:enableCreeperFindSpider=true

        # Enable creeper explosion reaction when damaged by another creeper (not only when killed). [default: true]
        B:enableCreeperHurtByCreeperExplosion=true

        # Enable creeper to explode immediately when killed while already ignited. [default: true]
        B:enableCreeperIgnitedDeathExplosion=true

        # Enable Creeper explosion when killed by another Creeper. [default: true]
        B:enableCreeperKilledByCreeperExplosion=true

        # Enable super creeper, can find you chest and more [default: false]
        B:enableSuperCreeper=false

        # Power of the explosion caused by Super Creeper [range: -2147483648 ~ 2147483647, default: 3]
        I:explosionPower=3

        # Distance at which the Super Creeper will trigger its explosion. [range: 4.9E-324 ~ 1.7976931348623157E308, default: 2.5]
        D:explosionTriggerRange=2.5

        # Movement speed multiplier for Super Creeper [range: 4.9E-324 ~ 1.7976931348623157E308, default: 1.0]
        D:moveSpeed=1.0

        # Search radius for players [range: -2147483648 ~ 2147483647, default: 16]
        I:playerFindRadius=16

        # Interval in ticks between player targeting scans [range: -2147483648 ~ 2147483647, default: 10]
        I:playerTargetInterval=10

        # Radius in which Creepers search for Spiders. [range: -2147483648 ~ 2147483647, default: 16]
        I:spiderFindRadius=16

        # Spider move speed when mounted by a Creeper. [range: 4.9E-324 ~ 1.7976931348623157E308, default: 1.3]
        D:spiderMoveSpeed=1.3

        # Interval (in ticks) between Creeper spider targeting attempts. [range: -2147483648 ~ 2147483647, default: 20]
        I:spiderTargetInterval=20
    }

    ##########################################################################################################
    # tickrate
    #--------------------------------------------------------------------------------------------------------#
    # Tickrate section
    ##########################################################################################################

    tickrate {
        # Default tickrate. The game will always initialize with this value. [range: 1.4E-45 ~ 3.4028235E38, default: 20.0]
        S:defaultTickrate=20.0

        # Maximum tickrate from servers. Prevents really high tickrate values. [range: 1.4E-45 ~ 3.4028235E38, default: 1000.0]
        S:maxTickrate=1000.0

        # Minimum tickrate from servers. Prevents really low tickrate values. [range: 1.4E-45 ~ 3.4028235E38, default: 0.1]
        S:minTickrate=0.1
    }

    ##########################################################################################################
    # minecraft
    #--------------------------------------------------------------------------------------------------------#
    # Minecraft section
    ##########################################################################################################

    minecraft {
        # Enhances the /kill command to support modern selectors and improved behaviour. [default: true]
        B:enableKillEnhance=true
    }

}


